global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mariadb'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  - job_name: 'users_service'
    static_configs:
      - targets: ['users_service:3000']

  - job_name: 'api_service'
    static_configs:
      - targets: ['api_service:3000']

  - job_name: 'chat_service'
    static_configs:
      - targets: ['chat_service:3000']