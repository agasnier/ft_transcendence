# Dev override: run the users_service with hot reload and the source mounted as a volume.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  nginx:
    build:
      context: ./services/nginx
      dockerfile: Dockerfile.dev

  vault:
    build:
      context: ./services/vault
      dockerfile: Dockerfile.dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_UI: "true"
      VAULT_API_ADDR: "http://vault:8200"
    ports:
      - "8200:8200"

  database:
    # expose mariadb into localhost for drizzle
    ports:
      - "3306:3306"

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/frontend/app/src:/app/src

  users_service:
    build:
      context: ./services/backend/users_service
      dockerfile: Dockerfile.dev
    volumes:
      # Mount local source for hot reload
      - ./services/backend/users_service/app/src:/app/src
      # Mount migrations so newly generated ones are picked up without rebuild
      - ./services/backend/users_service/app/drizzle:/app/drizzle

  api_service:
    build:
      context: ./services/backend/api_service
      dockerfile: Dockerfile.dev
    volumes:
      # Mount local source for hot reload
      - ./services/backend/api_service/app/src:/app/src
      # Mount migrations so newly generated ones are picked up without rebuild
      - ./services/backend/api_service/app/drizzle:/app/drizzle

# dev volume independent from prod volume
volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/mariadb-dev
