# Dev override: run the auth_service with hot reload and the source mounted as a volume.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  database:
    # expose mariadb into localhost for drizzle
    ports:
      - "3306:3306"

  nginx:
    volumes:
      - ./services/nginx/nginx.dev.conf:/etc/nginx/nginx.conf

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/frontend/app/src:/app/src

  auth_service:
    build:
      context: ./services/backend/auth_service
      dockerfile: Dockerfile.dev
    volumes:
      # Mount local source for hot reload
      - ./services/backend/auth_service/app/src:/app/src
      # Mount migrations so newly generated ones are picked up without rebuild
      - ./services/backend/auth_service/app/drizzle:/app/drizzle
