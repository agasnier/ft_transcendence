services:
  nginx:
    build: ./services/nginx
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - frontend
      - users_service
      - api_service
    networks:
      - transcendence
    restart: unless-stopped

  vault:
    build: ./services/vault
    env_file:
      - ./env/.env
    secrets:
      - db_root_password
    volumes: 
      - vault_data:/vault/file
      - approle:/vault/approle
    healthcheck:
      test: ["CMD-SHELL", "test -f /vault/approle/.ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - transcendence
    restart: unless-stopped

  database:
    build: ./services/database
    env_file:
      - ./env/.env
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transcendence
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    networks:
      - transcendence
    restart: unless-stopped

  users_service:
    build: ./services/backend/users_service
    env_file:
      - ./env/.env
    depends_on:
      database:
        condition: service_healthy
      users_service_agent:
        condition: service_healthy
    volumes:
      - users_service_creds:/vault/secrets:ro
    networks:
      - transcendence
    restart: unless-stopped

  users_service_agent:
    build: ./services/vault/agents/users_service
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - approle:/vault/approle:ro
      - users_service_creds:/vault/secrets
    healthcheck:
      test: ["CMD-SHELL", "test -f /vault/secrets/db_creds.json"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - transcendence
    restart: unless-stopped

  api_service:
    build: ./services/backend/api_service
    env_file:
      - ./env/.env
    depends_on:
      database:
        condition: service_healthy
      api_service_agent:
        condition: service_healthy
    volumes:
      - api_service_creds:/vault/secrets:ro
    networks:
      - transcendence
    restart: unless-stopped

  api_service_agent:
    build: ./services/vault/agents/api_service
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - approle:/vault/approle:ro
      - api_service_creds:/vault/secrets
    healthcheck:
      test: ["CMD-SHELL", "test -f /vault/secrets/db_creds.json"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - transcendence
    restart: unless-stopped

networks:
  transcendence:
    driver: bridge

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/mariadb

  vault_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/vault

  approle:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

  users_service_creds:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

  api_service_creds:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

secrets:
  db_root_password:
    file: ./env/secrets/db_root_password.txt