services:
  nginx:
    build: ./services/nginx
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - frontend
      - auth_service
    networks:
      - transcendence
    restart: unless-stopped

  vault:
    build: ./services/vault
    secrets:
      - db_root_password
    volumes: 
      - vault_data:/vault/file
      - approle:/vault/approle
    networks:
      - transcendence
    restart: unless-stopped

  database:
    build: ./services/database
    env_file:
      - ./env/.env
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - transcendence
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    networks:
      - transcendence
    restart: unless-stopped

  auth_service:
    build: ./services/backend/auth_service
    env_file:
      - ./env/.env
    depends_on:
      database:
        condition: service_healthy
      auth_service_agent:
        condition: service_healthy
    volumes:
      - auth_service_creds:/vault/secrets:ro
    networks:
      - transcendence
    restart: unless-stopped

  auth_service_agent:
    build: ./services/vault/agents/auth_service
    depends_on:
      - vault
    volumes:
      - approle:/vault/approle:ro
      - auth_service_creds:/vault/secrets
    healthcheck:
      test: ["CMD-SHELL", "test -f /vault/secrets/db_creds.json"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - transcendence
    restart: unless-stopped

networks:
  transcendence:
    driver: bridge

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/mariadb

  vault_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/vault

  approle:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

  auth_service_creds:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

secrets:
  db_root_password:
    file: ./env/secrets/db_root_password.txt